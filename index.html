<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUCY // Sovereign Node</title>
  
  <!-- Tvoja favicon (iba hore v záložke) -->
  <link rel="icon" type="image/png" href="tvoje-logo-ai-stred.png?v=5">
  <link rel="apple-touch-icon" href="tvoje-logo-ai-stred.png?v=5">
  
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-black: #000000;
      --surface: #030303;
      --text-main: #ffffff;
      --text-muted: #555555;
      --border: #141414;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-black);
      color: var(--text-main);
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 32px;
      z-index: 1;
    }

    .header { 
      text-align: left; 
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }

    .status {
      font-size: 0.55rem;
      letter-spacing: 0.3em;
      color: var(--text-muted);
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .dot {
      width: 4px;
      height: 4px;
      background-color: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 8px #ffffff;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.3; }
      50% { opacity: 1; }
      100% { opacity: 0.3; }
    }

    h1 {
      font-weight: 300;
      font-size: 1.4rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
    }

    /* Rozhranie Chat Avatara */
    .avatar-interface {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 24px;
      min-height: 280px;
      display: flex;
      flex-direction: column;
    }

    .chat-log {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 24px;
    }

    .message {
      font-weight: 300;
      font-size: 0.85rem;
      line-height: 1.8;
      color: #cccccc;
    }

    .message b {
      font-weight: 500;
      color: #ffffff;
    }

    .cursor::after {
      content: '█';
      animation: blink 1s step-start infinite;
      margin-left: 4px;
      color: #ffffff;
    }
    
    @keyframes blink { 50% { opacity: 0; } }

    /* Dotazovacie Prompty */
    .prompts {
      display: flex;
      flex-direction: column;
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
    }

    .prompt-btn {
      background: var(--surface);
      border: none;
      color: var(--text-muted);
      padding: 14px 16px;
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      text-align: left;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .prompt-btn::before {
      content: '>';
      color: var(--text-muted);
      opacity: 0.5;
    }

    .prompt-btn:hover { 
      color: #ffffff; 
      background: #080808;
    }
    
    .prompt-btn:hover::before { color: #ffffff; opacity: 1; }

    /* Hlavné akcie */
    .actions {
      display: flex;
      flex-direction: row;
      gap: 8px;
    }

    .btn {
      flex: 1;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 16px;
      font-size: 0.6rem;
      font-weight: 400;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.4s ease;
      text-decoration: none;
      text-align: center;
    }

    .btn:hover {
      color: #ffffff;
      border-color: #333333;
    }
  </style>
</head>
<body>

<div class="container">
  
  <div class="header">
    <div class="status">
      <span class="dot"></span> Pripájanie na lokálny uzol...
    </div>
    <h1>LUCY</h1>
  </div>

  <div class="avatar-interface">
    <div class="chat-log" id="chat-log">
      <!-- Sem bude Lucy naživo vypisovať text -->
      <div class="message cursor" id="lucy-typing"></div>
    </div>

    <div class="prompts" id="prompts-container" style="opacity: 0; transition: opacity 1s ease;">
      <button class="prompt-btn" onclick="askLucy('profil')">Identifikuj fyzický subjekt (Vzdelanie)</button>
      <button class="prompt-btn" onclick="askLucy('tech')">Aké sú aktuálne operácie a výpočtová kapacita?</button>
      <button class="prompt-btn" onclick="askLucy('publikacie')">Aktivuj prístup k výskumu a myšlienkam</button>
    </div>
  </div>

  <div class="actions">
    <button class="btn" onclick="downloadVCard()">Uložiť VCF Dátový Súbor</button>
    <a href="https://www.linkedin.com/in/lucia-malickova" target="_blank" class="btn">Autentifikácia (LinkedIn)</a>
  </div>

</div>

<script>
  // Presné kontaktné údaje do vizitky
  function downloadVCard() {
    const vcardData = 
`BEGIN:VCARD
VERSION:3.0
N:Malíčková;Lucia;Dr.;;
FN:Dr. Lucia Malíčková
ORG:Modelos Inteligencia Artificial S.L.
TITLE:Founder & AI Architect
TEL;TYPE=CELL:+421907536490
EMAIL;TYPE=WORK,INTERNET:lucy@thesafehaven.ai
URL:https://www.modelosinteligenciaartificial.es
URL;TYPE=LinkedIn:https://www.linkedin.com/in/lucia-malickova
NOTE:Kontakt získaný cez lokálny AI uzol (Sovereign Token).
END:VCARD`;

    const blob = new Blob([vcardData], { type: 'text/vcard;charset=utf-8' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = "Dr_Lucia_Malickova.vcf";
    link.click();
  }

  // Logika chatovania - AI Avatar efekt
  const typingElement = document.getElementById('lucy-typing');
  let typingTimeout;

  // Iniciačná sekvencia pri načítaní stránky
  window.onload = () => {
    setTimeout(() => {
      document.querySelector('.status').innerHTML = '<span class="dot"></span> Spojenie nadviazané';
      typeWriter("Detegovaný fyzický token... Prístup povolený. Som Lucy, autonómny uzol a digitálna inteligencia pre The Safe Haven. Moja fyzická verzia (Dr. Lucia Malíčková) je momentálne zaneprázdnená. Som tu, aby som zodpovedala vaše otázky v jej mene. Úplne logicky a bez zbytočného cloudu.", () => {
        document.getElementById('prompts-container').style.opacity = 1;
      });
    }, 800);
  };

  // Funkcia na simuláciu rozmýšľania a následného písania
  function askLucy(topic) {
    document.getElementById('prompts-container').style.opacity = 0.3; // Stlmí tlačidlá počas písania
    clearTimeout(typingTimeout);
    typingElement.innerHTML = '';
    
    let responseText = "";
    
    if (topic === 'profil') {
      responseText = "Moja organická dvojička má doktorát z neuromarketingu, inžiniersky titul z ekonómie, bakalársky zo zdravotníckych vied a spravila si DBA z HPC a umelej inteligencie. Zjavne mala pocit, že len jeden odbor je nuda. Okrem iného prednáša digitálne zručnosti a behaviorálne stratégie.";
    } else if (topic === 'tech') {
      responseText = "Bežíme výhradne na on-premise infraštruktúre. Špecializujeme sa na fine-tuning open-weights modelov (Mistral, Llama) s využitím superpočítačov EuroHPC. Žiadne odosielanie dát externým korporáciám. Staviame off-grid komplex z opunciovo-vápenných zmesí rátaných na kvantových emulátoroch. Absolútna suverenita.";
    } else if (topic === 'publikacie') {
      responseText = "Jej najnovší výskum zahŕňa publikáciu 'Behavioral Reprogramming of Open-Weights Models' pre žurnál Engineering Applications of Artificial Intelligence pod hlavičkou VŠB-TUO. Okrem toho publikuje newsletter o hlbokých prienikoch AI – aktuálne rieši flexibilitu, schopnosť učiť sa a tzv. output expansion. Všetky detaily má na svojom LinkedIn profile.";
    }

    // Krátka pauza na "spracovanie požiadavky"
    setTimeout(() => {
      typeWriter(responseText, () => {
        document.getElementById('prompts-container').style.opacity = 1;
      });
    }, 400);
  }

  // Samotný engine na postupné písanie textu
  function typeWriter(text, callback) {
    let i = 0;
    typingElement.innerHTML = '';
    
    function typeNextChar() {
      if (i < text.length) {
        typingElement.innerHTML += text.charAt(i);
        i++;
        typingTimeout = setTimeout(typeNextChar, 10 + Math.random() * 15); // Jemne variabilná rýchlosť pre ľudskejší / realistický efekt
      } else {
        if(callback) callback();
      }
    }
    typeNextChar();
  }
</script>

</body>
</html>
