<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI LUCY // Digital Twin</title>
  
  <link rel="icon" type="image/png" href="tvoje-logo-ai-stred.png?v=6">
  <link rel="apple-touch-icon" href="tvoje-logo-ai-stred.png?v=6">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-black: #000000;
      --surface: #050505;
      --text-main: #ffffff;
      --text-muted: #666666;
      --border: #1a1a1a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-black);
      color: var(--text-main);
      font-family: 'Montserrat', sans-serif;
      height: 100vh;
      height: 100dvh;
      overflow: hidden; 
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .header { 
      position: relative;
      text-align: left; 
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      flex-shrink: 0;
    }

    .lang-switcher {
      position: absolute;
      top: 0;
      right: 0;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      display: flex;
      gap: 12px;
    }

    .lang-btn { cursor: pointer; transition: color 0.3s; }
    .lang-btn.active { color: #ffffff; font-weight: 600; }
    .lang-btn:hover { color: #ffffff; }

    .status {
      font-size: 0.55rem;
      letter-spacing: 0.3em;
      color: var(--text-muted);
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .dot {
      width: 4px;
      height: 4px;
      background-color: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 8px #ffffff;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.3; }
      50% { opacity: 1; }
      100% { opacity: 0.3; }
    }

    h1 {
      font-weight: 400;
      font-size: 1.4rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
    }

    .ai-label {
      font-weight: 600;
      color: #ffffff;
    }

    /* CHATOVACIA ČASŤ */
    .avatar-interface {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden; 
    }

    .chat-log {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scrollbar-width: none;
    }
    .chat-log::-webkit-scrollbar { display: none; }

    .message-block { display: flex; flex-direction: column; gap: 4px; }

    .message-sender {
      font-size: 0.55rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .message {
      font-weight: 300;
      font-size: 0.85rem;
      line-height: 1.6;
      color: #cccccc;
    }

    .message.user { color: #ffffff; }
    .message.lucy { color: #cccccc; }

    .cursor::after {
      content: '█';
      animation: blink 1s step-start infinite;
      margin-left: 4px;
      color: #ffffff;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* INPUT POLE */
    .input-area {
      display: flex;
      border-top: 1px solid var(--border);
      background: #020202;
    }

    .input-area input {
      flex: 1;
      background: transparent;
      border: none;
      padding: 16px 20px;
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.8rem;
      outline: none;
    }

    .input-area input::placeholder { color: #444; }

    .input-area button {
      background: transparent;
      border: none;
      border-left: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0 20px;
      cursor: pointer;
      font-size: 1rem;
      transition: color 0.3s;
    }
    .input-area button:hover { color: #ffffff; }

    /* TLAČIDLÁ (Footer) */
    .actions {
      flex-shrink: 0;
      display: flex;
      flex-direction: row;
      gap: 8px;
    }

    .btn {
      flex: 1;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 16px;
      font-size: 0.6rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.4s ease;
      text-decoration: none;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn:hover { color: #ffffff; border-color: #333333; }

    /* UPOZORNENIE AI (AI Act) */
    .notice {
      flex-shrink: 0;
      font-size: 0.55rem;
      letter-spacing: 0.05em;
      line-height: 1.6;
      color: var(--text-muted);
      text-align: center;
    }
    .notice a { color: var(--text-muted); text-decoration: underline; }
    .notice a:hover { color: #ffffff; }
  </style>
</head>
<body>

<div class="container">

  <div class="header">
    <div class="lang-switcher">
      <span class="lang-btn active" onclick="setLang('sk')" id="btn-sk">SK</span>
      <span class="lang-btn" onclick="setLang('en')" id="btn-en">EN</span>
      <span class="lang-btn" onclick="setLang('es')" id="btn-es">ES</span>
    </div>
    <div class="status">
      <span class="dot"></span> <span id="ui-status">Spojenie nadviazané</span>
    </div>
    <h1><span class="ai-label">AI</span> LUCY</h1>
  </div>

  <div class="avatar-interface">
    <div class="chat-log" id="chat-log"></div>
    <div class="input-area">
      <input type="text" id="user-input" placeholder="Napíš správu pre AI Lucy..." maxlength="600" onkeypress="handleEnter(event)">
      <button onclick="processInput()">►</button>
    </div>
  </div>

  <div class="actions">
    <button class="btn" onclick="downloadVCard()" id="ui-vcard">Ulož vizitku do mobilu</button>
    <a href="https://www.linkedin.com/in/lucia-malickova" target="_blank" rel="noopener" class="btn" id="ui-linkedin" onclick="sendEvent('linkedin')">Spoj sa na LinkedIn</a>
  </div>

  <div class="notice">
    <span id="ui-notice">Rozprávate sa s umelou inteligenciou, nie s Luciou osobne. AI beží na vlastnom hardvéri a môže sa mýliť.</span>
    · <a href="privacy.html" id="ui-privacy">Ochrana súkromia</a>
  </div>

</div>

<script>
  const i18n = {
    sk: {
      status: "Spojenie nadviazané",
      placeholder: "Napíš správu pre AI Lucy...",
      btnVcard: "Ulož vizitku do mobilu",
      btnLinked: "Spoj sa na LinkedIn",
      notice: "Rozprávate sa s umelou inteligenciou, nie s Luciou osobne. AI beží na vlastnom hardvéri a môže sa mýliť.",
      privacy: "Ochrana súkromia",
      senderUser: "Hosť",
      responses: {
        welcome: "Ahoj, som AI Lucy – digitálna dvojička Lucie Malíčkovej. Odpovedám v prvej osobe, ale som umelá inteligencia, nie Lucia osobne. Rada vám porozprávam o svojej práci, výskume a projektoch ako The Safe Haven, Lucy AI či MIA. Čo vás ku mne priviedlo?",
        personal: "Narodila som sa 5. augusta 1988 v Poprade. Som vydatá a mám 3 deti. Žijem striedavo na Slovensku a na Tenerife. Ďalšie súkromné detaily si nechám pre seba.",
        edu: "Mám vedecký PhD. z behaviorálneho správania a profesný doktorát DBA z HPC a AI. Ďalej inžiniersky titul z ekonómie, MSc. z neuromarketingu a bakalársky titul zo zdravotníckych vied.",
        work: "Som predovšetkým vedkyňa a výskumníčka. Založila som Modelos Inteligencia Artificial a off-grid projekt The Safe Haven. Pracujem v Národnom superpočítačovom centre Slovenska a Českej republiky a učím na inštitúte CEMI (AI pre manažérov, AI v zdravotníctve, Digitálne zručnosti pre manažérov). Spoluvlastním aj rezort Villa Lucia v UNESCO zóne Banskej Štiavnice.",
        safehaven: "The Safe Haven je môj vizionársky off-grid projekt na Tenerife. Prepája udržateľnosť, biomateriály, 3D tlačenú architektúru a vlastnú lokálnu umelú inteligenciu bežiacu nezávisle od cloudov. Viac nájdete na thesafehaven.ai.",
        hobbies: "Mojou veľkou vášňou je golf. V minulosti som bola dokonca prezidentkou Slovenskej golfovej asociácie.",
        research: "Publikujem v oblasti HPC, AI a kvantového počítania. Najdôležitejšie sú práce 'Behavioral Reprogramming of Open-Weights Models' a výskum VQE. Kompletný zoznam mojich prác nájdete na ORCID.",
        newsletter: "Svoje myšlienky o prieniku AI a spoločnosti píšem v newslettri na LinkedIn. Aktuálne o 'output expansion', flexibilite a schopnosti učiť sa. Kliknite dole na LinkedIn a prihláste sa na odber.",
        contact: "Najrýchlejšie ma zastihnete na lucy@thesafehaven.ai alebo na čísle +421 907 536 490. Kontakt si môžete uložiť tlačidlom pod chatom alebo sa spojiť cez LinkedIn.",
        fallback: "Na toto vám teraz presnú odpoveď nedám. Pozrite si thesafehaven.ai, môj LinkedIn, alebo si uložte kontakt a napíšte mi priamo."
      }
    },
    en: {
      status: "Connection established",
      placeholder: "Message AI Lucy...",
      btnVcard: "Save contact to mobile",
      btnLinked: "Connect on LinkedIn",
      notice: "You are talking to an artificial intelligence, not to Lucia in person. The AI runs on its own hardware and can make mistakes.",
      privacy: "Privacy",
      senderUser: "Guest",
      responses: {
        welcome: "Hi, I am AI Lucy – the digital twin of Dr. Lucia Malíčková. I answer in the first person, but I am an artificial intelligence, not Lucia herself. I am happy to tell you about my work, research and projects such as The Safe Haven, Lucy AI or MIA. What brings you here?",
        personal: "I was born on August 5, 1988, in Poprad. I am married and have 3 children. I divide my time between Slovakia and Tenerife. The rest of my private life I keep to myself.",
        edu: "I hold a scientific PhD in behavioral science, a professional DBA in HPC and AI, a Master's (Ing.) in economics, an MSc in neuromarketing and a BSc in health sciences.",
        work: "I am primarily a scientist and researcher. I founded Modelos Inteligencia Artificial and The Safe Haven. I work at the National Supercomputing Centres of Slovakia and the Czech Republic and lecture at the CEMI institute (AI for managers, Digital skills). I also co-own Villa Lucia in the UNESCO zone of Banská Štiavnica.",
        safehaven: "The Safe Haven is my off-grid project on Tenerife, combining sustainability, biomaterials, 3D-printed architecture and sovereign local AI. Find out more at thesafehaven.ai.",
        hobbies: "My main passion is golf. I even served as President of the Slovak Golf Association.",
        research: "I publish in HPC, AI and quantum computing. Key papers include 'Behavioral Reprogramming of Open-Weights Models' and my VQE research. My complete works are on ORCID.",
        newsletter: "I share my thoughts on AI and society in my LinkedIn newsletter, currently about 'output expansion', flexibility and the ability to learn. Check my LinkedIn profile to subscribe.",
        contact: "The fastest way to reach me: lucy@thesafehaven.ai or +421 907 536 490. Save my contact with the button below or connect on LinkedIn.",
        fallback: "I don't have an exact answer for that right now. Please visit thesafehaven.ai, my LinkedIn, or save my contact and write to me directly."
      }
    },
    es: {
      status: "Conexión establecida",
      placeholder: "Escribe a AI Lucy...",
      btnVcard: "Guardar contacto",
      btnLinked: "Conectar en LinkedIn",
      notice: "Estás hablando con una inteligencia artificial, no con Lucia en persona. La IA funciona en hardware propio y puede equivocarse.",
      privacy: "Privacidad",
      senderUser: "Invitado",
      responses: {
        welcome: "Hola, soy AI Lucy, la gemela digital de la Dra. Lucia Malíčková. Respondo en primera persona, pero soy una inteligencia artificial, no Lucia en persona. Te cuento con gusto sobre mi trabajo, investigación y proyectos como The Safe Haven, Lucy AI o MIA. ¿Qué te trae por aquí?",
        personal: "Nací el 5 de agosto de 1988 en Poprad. Estoy casada y tengo 3 hijos. Vivo entre Eslovaquia y Tenerife. El resto de mi vida privada me lo guardo.",
        edu: "Tengo un doctorado en ciencias del comportamiento, un DBA en HPC e IA, un máster en economía, un MSc en neuromarketing y un grado en ciencias de la salud.",
        work: "Soy científica e investigadora. Fundé Modelos Inteligencia Artificial y The Safe Haven. Trabajo en los Centros Nacionales de Supercomputación de Eslovaquia y Chequia y soy profesora en el instituto CEMI (IA para directivos). También soy copropietaria de Villa Lucia en Banská Štiavnica (UNESCO).",
        safehaven: "The Safe Haven es mi proyecto off-grid en Tenerife, que combina sostenibilidad, biomateriales, arquitectura impresa en 3D y una IA local soberana. Más detalles en thesafehaven.ai.",
        hobbies: "Mi gran pasión es el golf. Incluso fui presidenta de la Asociación Eslovaca de Golf.",
        research: "Publico sobre HPC, IA y computación cuántica. Trabajos clave: 'Behavioral Reprogramming of Open-Weights Models' e investigación VQE. Mi historial completo está en ORCID.",
        newsletter: "Comparto mis reflexiones sobre IA y sociedad en mi newsletter de LinkedIn, ahora sobre la 'expansión de outputs', la flexibilidad y la capacidad de aprender. Te sugiero leerlo en mi perfil.",
        contact: "Para contactarme: lucy@thesafehaven.ai o +421 907 536 490. Puedes guardar mi contacto con el botón inferior o conectar por LinkedIn.",
        fallback: "Ahora mismo no tengo la respuesta exacta. Visita thesafehaven.ai, mi LinkedIn, o guarda mi contacto y escríbeme directamente."
      }
    }
  };

  let currentLang = 'sk';
  const chatLog = document.getElementById('chat-log');
  let isTyping = false;

  // Anonymný identifikátor len pre túto návštevu (neukladá sa do prehliadača)
  const session = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Math.random()).slice(2);
  // Z ktorého tokenu / kampane návštevník prišiel, napr. ailucy.es/?t=websummit
  const card = (new URLSearchParams(location.search).get('t') || 'web').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 32) || 'web';
  // História rozhovoru pre AI (len v pamäti tejto stránky)
  const history = [];

  function setLang(lang) {
    currentLang = lang;
    document.documentElement.lang = lang;
    document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById('btn-' + lang).classList.add('active');

    document.getElementById('ui-status').innerText = i18n[lang].status;
    document.getElementById('user-input').placeholder = i18n[lang].placeholder;
    document.getElementById('ui-vcard').innerText = i18n[lang].btnVcard;
    document.getElementById('ui-linkedin').innerText = i18n[lang].btnLinked;
    document.getElementById('ui-notice').innerText = i18n[lang].notice;
    document.getElementById('ui-privacy').innerText = i18n[lang].privacy;
  }

  function scrollToBottom() {
    chatLog.scrollTop = chatLog.scrollHeight;
  }

  // Vytvorí bublinu správy a vráti element s textom
  function createMessage(sender) {
    const msgBlock = document.createElement('div');
    msgBlock.className = 'message-block';

    const senderTag = document.createElement('div');
    senderTag.className = 'message-sender';
    senderTag.innerText = sender === 'lucy' ? 'AI LUCY' : i18n[currentLang].senderUser;

    const msgText = document.createElement('div');
    msgText.className = 'message ' + sender;

    msgBlock.appendChild(senderTag);
    msgBlock.appendChild(msgText);
    chatLog.appendChild(msgBlock);
    scrollToBottom();
    return msgText;
  }

  // Predstierané písanie pre pevné texty (uvítanie, záložné odpovede)
  function typeText(msgText, text) {
    return new Promise(resolve => {
      msgText.classList.add('cursor');
      let i = 0;
      function typeNextChar() {
        if (i < text.length) {
          msgText.textContent += text.charAt(i);
          i++;
          scrollToBottom();
          setTimeout(typeNextChar, 10 + Math.random() * 15);
        } else {
          msgText.classList.remove('cursor');
          resolve();
        }
      }
      typeNextChar();
    });
  }

  function handleEnter(e) {
    if (e.key === 'Enter') processInput();
  }

  // Záloha: pôvodná detekcia kľúčových slov, keď AI na Macu nie je dostupná
  function keywordAnswer(text) {
    const lower = text.toLowerCase();
    let category = 'fallback';

    if (lower.match(/(narod|rodina|deti|vek|bydlisko|sukrom|manzel|osobn|born|family|kids|age|live|private|husband|nacimiento|familia|hijos|edad|vive|privad)/)) {
      category = 'personal';
    } else if (lower.match(/(skola|škola|vzdelanie|studium|štúdium|doktor|dba|bc|ing|msc|phd|education|university|study|degree|educación|universidad|estudio|grado)/)) {
      category = 'edu';
    } else if (lower.match(/(safe haven|tenerife|off-grid|architekt)/)) {
      category = 'safehaven';
    } else if (lower.match(/(praca|práca|pracuj|biznis|modelos|cemi|superpocitac|hpc|lektor|villa lucia|work|job|business|lecturer|trabajo|negocio|profesor)/)) {
      category = 'work';
    } else if (lower.match(/(hobby|volny cas|golf|zaujmy|konicek|free time|hobbies|tiempo libre|pasatiempo)/)) {
      category = 'hobbies';
    } else if (lower.match(/(vyskum|výskum|publik|orcid|vqe|vedec|veda|research|publication|science|scientist|investigación|publicación|ciencia)/)) {
      category = 'research';
    } else if (lower.match(/(myslien|newsletter|clank|úvah|thought|article|pensamiento|artículo)/)) {
      category = 'newsletter';
    } else if (lower.match(/(kontakt|cislo|číslo|mobil|telefon|telefón|email|mail|spojit|contact|phone|teléfono)/)) {
      category = 'contact';
    } else if (lower.match(/(ahoj|cau|dobry|čau|zdravim|hello|hi|hey|hola|buenos)/)) {
      category = 'welcome';
    }
    return i18n[currentLang].responses[category];
  }

  // Odpoveď z AI Lucy na vlastnom hardvéri, text pribúda naživo
  async function askAI(msgText) {
    const ctrl = new AbortController();
    // ak do 15 s nepríde prvé slovo, použije sa záloha
    let timer = setTimeout(() => ctrl.abort(), 15000);
    let answer = '';
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history, lang: currentLang, card, session }),
        signal: ctrl.signal,
      });
      if (!res.ok || !res.body) throw new Error('AI nedostupná');

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      msgText.classList.add('cursor');
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const parts = buf.split('\n\n');
        buf = parts.pop();
        for (const part of parts) {
          const line = part.trim();
          if (!line.startsWith('data:')) continue;
          const data = line.slice(5).trim();
          if (data === '[DONE]') continue;
          const t = JSON.parse(data).t || '';
          if (t && timer) { clearTimeout(timer); timer = null; }
          answer += t;
          msgText.textContent = answer;
          scrollToBottom();
        }
      }
      msgText.classList.remove('cursor');
      if (!answer) throw new Error('prázdna odpoveď');
      return answer;
    } catch (e) {
      if (timer) clearTimeout(timer);
      msgText.classList.remove('cursor');
      // ak už časť odpovede prišla, necháme ju tak
      if (answer) return answer;
      throw e;
    }
  }

  async function processInput() {
    if (isTyping) return;
    const inputField = document.getElementById('user-input');
    const text = inputField.value.trim();
    if (!text) return;

    isTyping = true;
    createMessage('user').textContent = text;
    inputField.value = '';
    history.push({ role: 'user', content: text });

    const msgText = createMessage('lucy');
    let answer;
    try {
      answer = await askAI(msgText);
    } catch (e) {
      answer = keywordAnswer(text);
      msgText.textContent = '';
      await typeText(msgText, answer);
    }
    history.push({ role: 'assistant', content: answer });
    isTyping = false;
  }

  // Anonymná udalosť pre analytiku (otvorenie, uloženie vizitky, LinkedIn)
  function sendEvent(type) {
    try {
      fetch('/api/event', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ type, card, session }),
        keepalive: true,
      }).catch(() => {});
    } catch (e) {}
  }

  window.onload = () => {
    sendEvent('open');
    setTimeout(async () => {
      isTyping = true;
      const welcome = i18n[currentLang].responses.welcome;
      await typeText(createMessage('lucy'), welcome);
      history.push({ role: 'assistant', content: welcome });
      isTyping = false;
    }, 600);
  };

  function downloadVCard() {
    sendEvent('vcard');
    const vcardData =
`BEGIN:VCARD
VERSION:3.0
N:Malíčková;Lucia;Dr.;;
FN:Dr. Lucia Malíčková
ORG:Modelos Inteligencia Artificial S.L.
TITLE:Founder & AI Architect
TEL;TYPE=CELL:+421907536490
EMAIL;TYPE=WORK,INTERNET:lucy@thesafehaven.ai
URL:https://www.thesafehaven.ai
URL;TYPE=LinkedIn:https://www.linkedin.com/in/lucia-malickova
NOTE:Contact provided via AI LUCY (Sovereign Node).
END:VCARD`;

    const blob = new Blob([vcardData], { type: 'text/vcard;charset=utf-8' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = "Dr_Lucia_Malickova.vcf";
    link.click();
  }
</script>

</body>
</html>
