<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LUCY // Sovereign Node</title>
  
  <link rel="icon" type="image/png" href="tvoje-logo-ai-stred.png?v=5">
  <link rel="apple-touch-icon" href="tvoje-logo-ai-stred.png?v=5">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-black: #000000;
      --surface: #050505;
      --text-main: #ffffff;
      --text-muted: #666666;
      --border: #1a1a1a;
      --accent: #d4af37; /* Jemný odkaz na zlatú */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-black);
      color: var(--text-main);
      font-family: 'Montserrat', sans-serif;
      /* Zamedzenie scrollovania celej stránky */
      height: 100vh;
      height: 100dvh;
      overflow: hidden; 
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .header { 
      position: relative;
      text-align: left; 
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      flex-shrink: 0;
    }

    .lang-switcher {
      position: absolute;
      top: 0;
      right: 0;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      display: flex;
      gap: 12px;
    }

    .lang-btn {
      cursor: pointer;
      transition: color 0.3s;
    }

    .lang-btn.active { color: #ffffff; font-weight: 600; }
    .lang-btn:hover { color: #ffffff; }

    .status {
      font-size: 0.55rem;
      letter-spacing: 0.3em;
      color: var(--text-muted);
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .dot {
      width: 4px;
      height: 4px;
      background-color: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 8px #ffffff;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.3; }
      50% { opacity: 1; }
      100% { opacity: 0.3; }
    }

    h1 {
      font-weight: 300;
      font-size: 1.4rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
    }

    /* CHATOVACIA ČASŤ */
    .avatar-interface {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden; /* Dôležité pre správne scrollovanie zoznamu */
    }

    .chat-log {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scrollbar-width: none; /* Firefox */
    }
    .chat-log::-webkit-scrollbar { display: none; } /* Chrome/Safari */

    .message-block {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .message-sender {
      font-size: 0.55rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .message {
      font-weight: 300;
      font-size: 0.85rem;
      line-height: 1.6;
      color: #cccccc;
    }

    .message.user { color: #ffffff; }
    .message.lucy { color: #cccccc; }

    .cursor::after {
      content: '█';
      animation: blink 1s step-start infinite;
      margin-left: 4px;
      color: #ffffff;
    }
    
    @keyframes blink { 50% { opacity: 0; } }

    /* INPUT POLE */
    .input-area {
      display: flex;
      border-top: 1px solid var(--border);
      background: #020202;
    }

    .input-area input {
      flex: 1;
      background: transparent;
      border: none;
      padding: 16px 20px;
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.8rem;
      outline: none;
    }

    .input-area input::placeholder { color: #444; }

    .input-area button {
      background: transparent;
      border: none;
      border-left: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0 20px;
      cursor: pointer;
      font-size: 1rem;
      transition: color 0.3s;
    }
    .input-area button:hover { color: #ffffff; }

    /* TLAČIDLÁ (Footer) */
    .actions {
      flex-shrink: 0;
      display: flex;
      flex-direction: row;
      gap: 8px;
    }

    .btn {
      flex: 1;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 16px;
      font-size: 0.6rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.4s ease;
      text-decoration: none;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn:hover { color: #ffffff; border-color: #333333; }
  </style>
</head>
<body>

<div class="container">
  
  <div class="header">
    <div class="lang-switcher">
      <span class="lang-btn active" onclick="setLang('sk')" id="btn-sk">SK</span>
      <span class="lang-btn" onclick="setLang('en')" id="btn-en">EN</span>
      <span class="lang-btn" onclick="setLang('es')" id="btn-es">ES</span>
    </div>
    <div class="status">
      <span class="dot"></span> <span id="ui-status">Spojenie nadviazané</span>
    </div>
    <h1>LUCY</h1>
  </div>

  <div class="avatar-interface">
    <div class="chat-log" id="chat-log">
      <!-- Chat história -->
    </div>
    <div class="input-area">
      <input type="text" id="user-input" placeholder="Opýtaj sa na Luciu..." onkeypress="handleEnter(event)">
      <button onclick="processInput()">►</button>
    </div>
  </div>

  <div class="actions">
    <button class="btn" onclick="downloadVCard()" id="ui-vcard">Ulož vizitku do mobilu</button>
    <a href="https://www.linkedin.com/in/lucia-malickova" target="_blank" class="btn" id="ui-linkedin">Spoj sa na LinkedIn</a>
  </div>

</div>

<script>
  // Preklady a logika umelej inteligencie
  const i18n = {
    sk: {
      status: "Spojenie nadviazané",
      placeholder: "Napíš správu pre Lucy...",
      btnVcard: "Ulož vizitku do mobilu",
      btnLinked: "Spoj sa na LinkedIn",
      senderUser: "Hosť",
      responses: {
        welcome: "Detegovaný fyzický token. Som Lucy, autonómny uzol a digitálna dvojička Lucie Malíčkovej. Som tu, aby som zodpovedala vaše otázky v jej mene. Úplne logicky a bez zbytočného cloudu. Čo vás zaujíma?",
        edu: "Moja organická dvojička má doktorát z neuromarketingu, inžiniersky titul z ekonómie, bakalársky zo zdravotníckych vied a spravila si DBA z HPC a umelej inteligencie. Prednáša aj digitálne zručnosti a behaviorálne stratégie.",
        work: "Bežíme výhradne on-premise. Špecializujeme sa na fine-tuning modelov (Mistral, Llama) na superpočítačoch EuroHPC. Staviame off-grid komplex The Safe Haven na Tenerife, kde využívame 3D tlač a biomateriály. Žiadny cloud, plná suverenita.",
        contact: "Ak ju chcete kontaktovať napriamo: Email je lucy@thesafehaven.ai a slovenské číslo +421 907 536 490. Najrýchlejšie je uložiť si vizitku cez tlačidlo dole, alebo sa spojiť cez LinkedIn.",
        research: "Zaujíma vás výskum? Jej najnovšia publikácia rieši 'Behavioral Reprogramming of Open-Weights Models' pod hlavičkou VŠB-TUO. Vo svojom newslettri analyzuje prieniky AI – aktuálne flexibilitu a output expansion.",
        fallback: "Som prísne logický model, táto otázka je mimo môj aktuálny kontext. Spýtajte sa ma na jej prácu, projekty The Safe Haven, vzdelanie, výskum, alebo si rovno uložte kontakt."
      }
    },
    en: {
      status: "Connection established",
      placeholder: "Message Lucy...",
      btnVcard: "Save contact to mobile",
      btnLinked: "Connect on LinkedIn",
      senderUser: "Guest",
      responses: {
        welcome: "Physical token detected. I am Lucy, an autonomous node and digital twin of Dr. Lucia Malíčková. I am here to answer on her behalf. Purely logical and without unnecessary cloud. What do you want to know?",
        edu: "My organic twin holds a PhD in neuromarketing, an MSc in economics, a BSc in health sciences, and a DBA in HPC and Artificial Intelligence. She also lectures on digital skills.",
        work: "We run strictly on-premise. We specialize in fine-tuning open-weights models using EuroHPC supercomputers. We are also building The Safe Haven on Tenerife, an off-grid complex using biomaterials and 3D printing.",
        contact: "To contact her directly: Email is lucy@thesafehaven.ai and phone is +421 907 536 490. The fastest way is to save the contact via the button below or connect on LinkedIn.",
        research: "Her latest research includes a publication on 'Behavioral Reprogramming of Open-Weights Models' (VŠB-TUO). She also writes a newsletter on AI intersections, currently focusing on flexibility and output expansion.",
        fallback: "I am a strictly logical model, this is outside my current context. Ask me about her work, The Safe Haven projects, education, research, or simply save the contact."
      }
    },
    es: {
      status: "Conexión establecida",
      placeholder: "Escribe a Lucy...",
      btnVcard: "Guardar en el móvil",
      btnLinked: "Conectar en LinkedIn",
      senderUser: "Invitado",
      responses: {
        welcome: "Token físico detectado. Soy Lucy, un nodo autónomo y gemela digital de la Dra. Lucia Malíčková. Estoy aquí para responder en su nombre. De forma puramente lógica. ¿Qué te interesa saber?",
        edu: "Mi gemela orgánica tiene un doctorado en neuromarketing, máster en economía, grado en ciencias de la salud y un DBA en HPC e IA. También imparte clases sobre habilidades digitales.",
        work: "Operamos de forma on-premise. Nos especializamos en afinar modelos open-weights usando superordenadores EuroHPC. Construimos The Safe Haven en Tenerife, un complejo off-grid usando biomateriales y impresión 3D.",
        contact: "Para contacto directo: Su email es lucy@thesafehaven.ai y el teléfono +421 907 536 490. Lo más rápido es guardar el contacto con el botón de abajo o conectarse por LinkedIn.",
        research: "Su investigación incluye la publicación 'Behavioral Reprogramming of Open-Weights Models'. Escribe una newsletter sobre IA, abordando actualmente la flexibilidad y la expansión de outputs.",
        fallback: "Soy un modelo puramente lógico, esta consulta está fuera de mi contexto. Pregúntame sobre su trabajo, The Safe Haven, educación, investigación, o simplemente guarda su contacto."
      }
    }
  };

  let currentLang = 'sk';
  const chatLog = document.getElementById('chat-log');
  let isTyping = false;
  let typingTimeout;

  function setLang(lang) {
    currentLang = lang;
    document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById('btn-' + lang).classList.add('active');

    document.getElementById('ui-status').innerText = i18n[lang].status;
    document.getElementById('user-input').placeholder = i18n[lang].placeholder;
    document.getElementById('ui-vcard').innerText = i18n[lang].btnVcard;
    document.getElementById('ui-linkedin').innerText = i18n[lang].btnLinked;
  }

  // Funkcia na posúvanie chatu úplne dole
  function scrollToBottom() {
    chatLog.scrollTop = chatLog.scrollHeight;
  }

  // Vytvorenie HTML bubliny v chate
  function appendMessage(sender, text, isAnimated = false) {
    const msgBlock = document.createElement('div');
    msgBlock.className = 'message-block';
    
    const senderTag = document.createElement('div');
    senderTag.className = 'message-sender';
    senderTag.innerText = sender === 'lucy' ? 'LUCY' : i18n[currentLang].senderUser;
    
    const msgText = document.createElement('div');
    msgText.className = 'message ' + sender;
    
    msgBlock.appendChild(senderTag);
    msgBlock.appendChild(msgText);
    chatLog.appendChild(msgBlock);
    
    if (isAnimated) {
      msgText.classList.add('cursor');
      let i = 0;
      isTyping = true;
      function typeNextChar() {
        if (i < text.length) {
          msgText.innerHTML += text.charAt(i);
          i++;
          scrollToBottom();
          typingTimeout = setTimeout(typeNextChar, 10 + Math.random() * 15);
        } else {
          msgText.classList.remove('cursor');
          isTyping = false;
        }
      }
      typeNextChar();
    } else {
      msgText.innerHTML = text;
      scrollToBottom();
    }
  }

  // Reakcia na stlačenie Enter
  function handleEnter(e) {
    if (e.key === 'Enter') processInput();
  }

  // Mozog umelej inteligencie - detekcia slov
  function processInput() {
    if (isTyping) return; // Zamedzí spamovaniu kým Lucy píše
    const inputField = document.getElementById('user-input');
    const text = inputField.value.trim();
    if (!text) return;

    appendMessage('user', text);
    inputField.value = '';

    const lower = text.toLowerCase();
    let category = 'fallback';

    // Logika detekcie kľúčových slov pre 3 jazyky
    if (lower.match(/(skola|škola|vzdelanie|studium|štúdium|doktorát|dba|bc|ing|education|university|study|estudio|educación|universidad)/)) {
      category = 'edu';
    } else if (lower.match(/(praca|práca|projekt|ai|hpc|safe haven|model|biznis|work|job|project|trabajo|proyecto)/)) {
      category = 'work';
    } else if (lower.match(/(kontakt|cislo|číslo|mobil|telefon|telefón|email|mail|spojit|contact|phone|número|teléfono)/)) {
      category = 'contact';
    } else if (lower.match(/(vyskum|výskum|publik|newsletter|kniha|článok|research|publication|book|investigación|publicación|libro)/)) {
      category = 'research';
    } else if (lower.match(/(ahoj|cau|dobry|čau|zdravim|hello|hi|hey|hola|buenos)/)) {
      category = 'welcome';
    }

    setTimeout(() => {
      appendMessage('lucy', i18n[currentLang].responses[category], true);
    }, 400); // Krátka pauza na "rozmýšľanie"
  }

  // Úvodná správa po načítaní
  window.onload = () => {
    setTimeout(() => {
      appendMessage('lucy', i18n[currentLang].responses.welcome, true);
    }, 600);
  };

  // VCard ostáva zachovaný
  function downloadVCard() {
    const vcardData = 
`BEGIN:VCARD
VERSION:3.0
N:Malíčková;Lucia;Dr.;;
FN:Dr. Lucia Malíčková
ORG:Modelos Inteligencia Artificial S.L.
TITLE:Founder & AI Architect
TEL;TYPE=CELL:+421907536490
EMAIL;TYPE=WORK,INTERNET:lucy@thesafehaven.ai
URL:https://www.modelosinteligenciaartificial.es
URL;TYPE=LinkedIn:https://www.linkedin.com/in/lucia-malickova
NOTE:Contact provided via Sovereign AI Node.
END:VCARD`;

    const blob = new Blob([vcardData], { type: 'text/vcard;charset=utf-8' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = "Dr_Lucia_Malickova.vcf";
    link.click();
  }
</script>

</body>
</html>
