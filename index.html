<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI LUCY // Digital Twin</title>
  
  <link rel="icon" type="image/png" href="tvoje-logo-ai-stred.png?v=6">
  <link rel="apple-touch-icon" href="tvoje-logo-ai-stred.png?v=6">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-black: #000000;
      --surface: #050505;
      --text-main: #ffffff;
      --text-muted: #666666;
      --border: #1a1a1a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-black);
      color: var(--text-main);
      font-family: 'Montserrat', sans-serif;
      height: 100vh;
      height: 100dvh;
      overflow: hidden; 
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .header { 
      position: relative;
      text-align: left; 
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      flex-shrink: 0;
    }

    .lang-switcher {
      position: absolute;
      top: 0;
      right: 0;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      display: flex;
      gap: 12px;
    }

    .lang-btn { cursor: pointer; transition: color 0.3s; }
    .lang-btn.active { color: #ffffff; font-weight: 600; }
    .lang-btn:hover { color: #ffffff; }

    .status {
      font-size: 0.55rem;
      letter-spacing: 0.3em;
      color: var(--text-muted);
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .dot {
      width: 4px;
      height: 4px;
      background-color: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 8px #ffffff;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.3; }
      50% { opacity: 1; }
      100% { opacity: 0.3; }
    }

    h1 {
      font-weight: 400;
      font-size: 1.4rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
    }

    .ai-label {
      font-weight: 600;
      color: #ffffff;
    }

    /* CHATOVACIA ČASŤ */
    .avatar-interface {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden; 
    }

    .chat-log {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scrollbar-width: none;
    }
    .chat-log::-webkit-scrollbar { display: none; }

    .message-block { display: flex; flex-direction: column; gap: 4px; }

    .message-sender {
      font-size: 0.55rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .message {
      font-weight: 300;
      font-size: 0.85rem;
      line-height: 1.6;
      color: #cccccc;
    }

    .message.user { color: #ffffff; }
    .message.lucy { color: #cccccc; }

    .cursor::after {
      content: '█';
      animation: blink 1s step-start infinite;
      margin-left: 4px;
      color: #ffffff;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* INPUT POLE */
    .input-area {
      display: flex;
      border-top: 1px solid var(--border);
      background: #020202;
    }

    .input-area input {
      flex: 1;
      background: transparent;
      border: none;
      padding: 16px 20px;
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.8rem;
      outline: none;
    }

    .input-area input::placeholder { color: #444; }

    .input-area button {
      background: transparent;
      border: none;
      border-left: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0 20px;
      cursor: pointer;
      font-size: 1rem;
      transition: color 0.3s;
    }
    .input-area button:hover { color: #ffffff; }

    /* TLAČIDLÁ (Footer) */
    .actions {
      flex-shrink: 0;
      display: flex;
      flex-direction: row;
      gap: 8px;
    }

    .btn {
      flex: 1;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 16px;
      font-size: 0.6rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.4s ease;
      text-decoration: none;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn:hover { color: #ffffff; border-color: #333333; }
  </style>
</head>
<body>

<div class="container">
  
  <div class="header">
    <div class="lang-switcher">
      <span class="lang-btn active" onclick="setLang('sk')" id="btn-sk">SK</span>
      <span class="lang-btn" onclick="setLang('en')" id="btn-en">EN</span>
      <span class="lang-btn" onclick="setLang('es')" id="btn-es">ES</span>
    </div>
    <div class="status">
      <span class="dot"></span> <span id="ui-status">Spojenie nadviazané</span>
    </div>
    <h1><span class="ai-label">AI</span> LUCY</h1>
  </div>

  <div class="avatar-interface">
    <div class="chat-log" id="chat-log"></div>
    <div class="input-area">
      <input type="text" id="user-input" placeholder="Opýtaj sa na Luciu..." onkeypress="handleEnter(event)">
      <button onclick="processInput()">►</button>
    </div>
  </div>

  <div class="actions">
    <button class="btn" onclick="downloadVCard()" id="ui-vcard">Ulož vizitku do mobilu</button>
    <a href="https://www.linkedin.com/in/lucia-malickova" target="_blank" class="btn" id="ui-linkedin">Spoj sa na LinkedIn</a>
  </div>

</div>

<script>
  const i18n = {
    sk: {
      status: "Spojenie nadviazané",
      placeholder: "Napíš správu pre AI Lucy...",
      btnVcard: "Ulož vizitku do mobilu",
      btnLinked: "Spoj sa na LinkedIn",
      senderUser: "Hosť",
      responses: {
        welcome: "Detegovaný fyzický token. Som AI Lucy, digitálna dvojička Lucie Malíčkovej. Som tu, aby som zodpovedala vaše otázky v jej mene. Keďže som jej dvojička, viem o nej všetko – spýtajte sa na prácu, vzdelanie, vedecké publikácie alebo jej myšlienky. Čo vás zaujíma?",
        personal: "Narodila sa 5. augusta 1988 v Poprade. Je vydatá a má 3 deti. Žije striedavo na Slovensku a na Tenerife. To je všetko, ďalšie súkromné detaily nie je potrebné rozvádzať.",
        edu: "Má vedecký PhD. z behaviorálneho správania a profesný doktorát DBA z HPC a AI. Ďalej má inžiniersky titul z ekonómie, MSc. z neuromarketingu a bakalársky titul zo zdravotníckych vied.",
        work: "Je predovšetkým vedec a výskumník. Založila Modelos Inteligencia Artificial a off-grid projekt The Safe Haven. Pracuje v Národnom superpočítačovom centre Slovenska a Českej republiky. Je tiež lektorkou inštitútu CEMI (predmety ako AI pre manažérov, AI v zdravotníctve, Digitálne zručnosti pre manažérov). Spoluvlastní aj rezort Villa Lucia v UNESCO zóne Banskej Štiavnice.",
        safehaven: "The Safe Haven je jej vizionársky off-grid projekt na Tenerife. Prepája udržateľnosť, biomateriály, 3D tlačenú architektúru a vlastnú lokálnu umelú inteligenciu bežiacu absolútne nezávisle na cloudoch. Detaily nájdete na thesafehaven.ai.",
        hobbies: "Jej veľkou vášňou je golf. V minulosti dokonca pôsobila ako prezidentka Slovenskej golfovej asociácie.",
        research: "Publikuje v oblasti HPC, AI a Quantum computing. Najdôležitejšie práce sú 'Behavioral Reprogramming of Open-Weights Models' a výskum VQE. Kompletný zoznam jej prác nájdete na platforme ORCID.",
        newsletter: "Jej myšlienky a postoje k prieniku AI a spoločnosti môžete čítať v jej LinkedIn newslettri. Aktuálne rozoberá témy ako 'output expansion', flexibilitu a schopnosť učiť sa. Odporúčam kliknúť dole na jej LinkedIn a prihlásiť sa na odber.",
        contact: "Najrýchlejší spôsob, ako ju zastihnúť: Email je lucy@thesafehaven.ai a slovenské číslo +421 907 536 490. Uložte si jej vizitku cez tlačidlo pod chatom, alebo sa spojte cez LinkedIn.",
        fallback: "Na toto presnú odpoveď nemám. Ak chcete vedieť bližšie informácie o jej výskume, projektoch alebo myšlienkach, pozrite si stránku thesafehaven.ai, prejdite na jej LinkedIn, alebo si uložte kontakt a napíšte jej priamo."
      }
    },
    en: {
      status: "Connection established",
      placeholder: "Message AI Lucy...",
      btnVcard: "Save contact to mobile",
      btnLinked: "Connect on LinkedIn",
      senderUser: "Guest",
      responses: {
        welcome: "Physical token detected. I am AI Lucy, the digital twin of Dr. Lucia Malíčková. I am here to answer on her behalf. Knowing her perfectly, you can ask me about her work, education, research publications, or thoughts. What interests you?",
        personal: "She was born on August 5, 1988, in Poprad. She is married and has 3 children. She divides her time between Slovakia and Tenerife. That covers the private life basics.",
        edu: "She holds a scientific PhD in behavioral science, a professional DBA in HPC and AI, a Master's (Ing.) in economics, an MSc in neuromarketing, and a BSc in health sciences.",
        work: "She is primarily a scientist and researcher. Founder of Modelos Inteligencia Artificial and The Safe Haven. She works at the National Supercomputing Centres of Slovakia and the Czech Republic. She is a lecturer at the CEMI institute (AI for managers, Digital skills). She also co-owns Villa Lucia in the UNESCO zone of Banská Štiavnica.",
        safehaven: "The Safe Haven is her off-grid project on Tenerife, combining sustainability, biomaterials, 3D printing, and sovereign local AI. Find out more at thesafehaven.ai.",
        hobbies: "Her main hobby is golf. In the past, she served as the President of the Slovak Golf Association.",
        research: "She publishes in HPC, AI, and Quantum computing. Key papers include 'Behavioral Reprogramming of Open-Weights Models' and VQE research. Find her complete works on ORCID.",
        newsletter: "She publishes her thoughts on AI and society in her LinkedIn newsletter, discussing 'output expansion', flexibility, and learning ability. Check her LinkedIn profile to read it.",
        contact: "To contact her: Email lucy@thesafehaven.ai or call +421 907 536 490. Save the contact via the button below or connect on LinkedIn.",
        fallback: "I don't have an exact answer for that. For more detailed information, please visit thesafehaven.ai, check her LinkedIn, or save her contact to ask her directly."
      }
    },
    es: {
      status: "Conexión establecida",
      placeholder: "Escribe a AI Lucy...",
      btnVcard: "Guardar contacto",
      btnLinked: "Conectar en LinkedIn",
      senderUser: "Invitado",
      responses: {
        welcome: "Token físico detectado. Soy AI Lucy, la gemela digital de la Dra. Lucia Malíčková. Estoy aquí para responder en su nombre. Lo sé todo sobre ella; pregúntame sobre su trabajo, educación, publicaciones o ideas. ¿Qué te interesa?",
        personal: "Nació el 5 de agosto de 1988 en Poprad. Está casada y tiene 3 hijos. Vive entre Eslovaquia y Tenerife. Esos son todos los detalles privados que compartimos.",
        edu: "Tiene un doctorado en ciencias del comportamiento, un DBA en HPC e IA, un máster en economía, un MSc en neuromarketing y un grado en ciencias de la salud.",
        work: "Es científica e investigadora. Fundadora de Modelos Inteligencia Artificial y The Safe Haven. Trabaja en los Centros Nacionales de Supercomputación de Eslovaquia y Chequia. Es profesora en el instituto CEMI (IA para directivos). También es copropietaria de Villa Lucia en Banská Štiavnica (UNESCO).",
        safehaven: "The Safe Haven es su proyecto off-grid en Tenerife, que combina sostenibilidad, impresión 3D y una IA local soberana. Más detalles en thesafehaven.ai.",
        hobbies: "Su afición principal es el golf. Fue presidenta de la Asociación Eslovaca de Golf.",
        research: "Publica sobre HPC, IA y computación cuántica. Trabajos clave: 'Behavioral Reprogramming of Open-Weights Models' e investigación VQE. Su historial completo está en ORCID.",
        newsletter: "Comparte sus reflexiones sobre IA y sociedad en su newsletter de LinkedIn, analizando la 'expansión de outputs' y la flexibilidad. Te sugiero leerlo en su perfil.",
        contact: "Para contactarla: Email lucy@thesafehaven.ai, teléfono +421 907 536 490. Puedes guardar el contacto con el botón inferior o conectarte por LinkedIn.",
        fallback: "No tengo la respuesta exacta a eso. Para más detalles, visita thesafehaven.ai, su LinkedIn, o guarda su contacto para escribirle directamente."
      }
    }
  };

  let currentLang = 'sk';
  const chatLog = document.getElementById('chat-log');
  let isTyping = false;
  let typingTimeout;

  function setLang(lang) {
    currentLang = lang;
    document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById('btn-' + lang).classList.add('active');

    document.getElementById('ui-status').innerText = i18n[lang].status;
    document.getElementById('user-input').placeholder = i18n[lang].placeholder;
    document.getElementById('ui-vcard').innerText = i18n[lang].btnVcard;
    document.getElementById('ui-linkedin').innerText = i18n[lang].btnLinked;
  }

  function scrollToBottom() {
    chatLog.scrollTop = chatLog.scrollHeight;
  }

  function appendMessage(sender, text, isAnimated = false) {
    const msgBlock = document.createElement('div');
    msgBlock.className = 'message-block';
    
    const senderTag = document.createElement('div');
    senderTag.className = 'message-sender';
    senderTag.innerText = sender === 'lucy' ? 'AI LUCY' : i18n[currentLang].senderUser;
    
    const msgText = document.createElement('div');
    msgText.className = 'message ' + sender;
    
    msgBlock.appendChild(senderTag);
    msgBlock.appendChild(msgText);
    chatLog.appendChild(msgBlock);
    
    if (isAnimated) {
      msgText.classList.add('cursor');
      let i = 0;
      isTyping = true;
      function typeNextChar() {
        if (i < text.length) {
          msgText.innerHTML += text.charAt(i);
          i++;
          scrollToBottom();
          typingTimeout = setTimeout(typeNextChar, 10 + Math.random() * 15);
        } else {
          msgText.classList.remove('cursor');
          isTyping = false;
        }
      }
      typeNextChar();
    } else {
      msgText.innerHTML = text;
      scrollToBottom();
    }
  }

  function handleEnter(e) {
    if (e.key === 'Enter') processInput();
  }

  // Detekcia kľúčových slov vo všetkých 3 jazykoch
  function processInput() {
    if (isTyping) return; 
    const inputField = document.getElementById('user-input');
    const text = inputField.value.trim();
    if (!text) return;

    appendMessage('user', text);
    inputField.value = '';

    const lower = text.toLowerCase();
    let category = 'fallback';

    if (lower.match(/(narod|rodina|deti|vek|bydlisko|sukrom|manzel|osobn|born|family|kids|age|live|private|husband|nacimiento|familia|hijos|edad|vive|privad)/)) {
      category = 'personal';
    } else if (lower.match(/(skola|škola|vzdelanie|studium|štúdium|doktor|dba|bc|ing|msc|phd|education|university|study|degree|educación|universidad|estudio|grado)/)) {
      category = 'edu';
    } else if (lower.match(/(safe haven|tenerife|off-grid|architekt)/)) {
      category = 'safehaven';
    } else if (lower.match(/(praca|práca|pracuj|biznis|modelos|cemi|superpocitac|hpc|lektor|villa lucia|work|job|business|lecturer|trabajo|negocio|profesor)/)) {
      category = 'work';
    } else if (lower.match(/(hobby|volny cas|golf|zaujmy|konicek|free time|hobbies|tiempo libre|pasatiempo)/)) {
      category = 'hobbies';
    } else if (lower.match(/(vyskum|výskum|publik|orcid|vqe|vedec|veda|research|publication|science|scientist|investigación|publicación|ciencia)/)) {
      category = 'research';
    } else if (lower.match(/(myslien|newsletter|clank|úvah|thought|article|pensamiento|artículo)/)) {
      category = 'newsletter';
    } else if (lower.match(/(kontakt|cislo|číslo|mobil|telefon|telefón|email|mail|spojit|contact|phone|teléfono)/)) {
      category = 'contact';
    } else if (lower.match(/(ahoj|cau|dobry|čau|zdravim|hello|hi|hey|hola|buenos)/)) {
      category = 'welcome';
    }

    setTimeout(() => {
      appendMessage('lucy', i18n[currentLang].responses[category], true);
    }, 400);
  }

  window.onload = () => {
    setTimeout(() => {
      appendMessage('lucy', i18n[currentLang].responses.welcome, true);
    }, 600);
  };

  function downloadVCard() {
    const vcardData = 
`BEGIN:VCARD
VERSION:3.0
N:Malíčková;Lucia;Dr.;;
FN:Dr. Lucia Malíčková
ORG:Modelos Inteligencia Artificial S.L.
TITLE:Founder & AI Architect
TEL;TYPE=CELL:+421907536490
EMAIL;TYPE=WORK,INTERNET:lucy@thesafehaven.ai
URL:https://www.thesafehaven.ai
URL;TYPE=LinkedIn:https://www.linkedin.com/in/lucia-malickova
NOTE:Contact provided via AI LUCY (Sovereign Node).
END:VCARD`;

    const blob = new Blob([vcardData], { type: 'text/vcard;charset=utf-8' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = "Dr_Lucia_Malickova.vcf";
    link.click();
  }
</script>

</body>
</html>
