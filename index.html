<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lucy | Digital Twin</title>
  
  <!-- Oklamanie cache pridaním ?v=3 -->
  <link rel="icon" type="image/png" href="tvoje-logo-ai-stred.png?v=3">
  
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-black: #000000;
      --surface: #040404;
      --text-main: #ffffff;
      --text-muted: #666666;
      --border: #1a1a1a;
      --gold: #d4af37; /* Pridaný zlatý akcent z loga */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-black);
      color: var(--text-main);
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      overflow-x: hidden;
    }

    /* Hypnotický ambientný podklad */
    body::before {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 100vw; height: 100vh;
      background: radial-gradient(circle at center, rgba(212, 175, 55, 0.03) 0%, transparent 60%);
      z-index: -1;
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 40px;
      z-index: 1;
    }

    .header { 
      text-align: center; 
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Štýl pre vložené logo */
    .mia-logo {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      margin-bottom: 24px;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.15); /* Jemná zlatá žiara */
      border: 1px solid rgba(212, 175, 55, 0.3);
    }

    h1 {
      font-weight: 300;
      font-size: 1.5rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .subtitle {
      font-weight: 300;
      font-size: 0.6rem;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    @keyframes slow-breath {
      0% { box-shadow: 0 0 15px rgba(255,255,255,0.02); border-color: #1a1a1a; }
      50% { box-shadow: 0 0 40px rgba(212, 175, 55, 0.08); border-color: #333333; }
      100% { box-shadow: 0 0 15px rgba(255,255,255,0.02); border-color: #1a1a1a; }
    }

    .node-box {
      border: 1px solid var(--border);
      background: var(--surface);
      padding: 32px 24px;
      animation: slow-breath 6s infinite ease-in-out;
    }

    .status {
      font-size: 0.55rem;
      letter-spacing: 0.25em;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .dot {
      width: 5px;
      height: 5px;
      background-color: var(--gold);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--gold);
    }

    .message {
      font-weight: 300;
      font-size: 0.9rem;
      line-height: 1.7;
      color: #b3b3b3;
      margin-bottom: 32px;
      min-height: 100px;
    }

    .message b {
      font-weight: 600;
      color: #ffffff;
    }

    .questions {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .question-btn {
      background: transparent;
      border: none;
      border-top: 1px solid var(--border);
      color: var(--text-muted);
      padding: 16px 4px;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      text-align: left;
      transition: all 0.3s ease;
      display: flex;
      justify-content: space-between;
    }

    .question-btn:hover { color: #ffffff; padding-left: 8px; }
    .question-btn:last-child { border-bottom: 1px solid var(--border); }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      width: 100%;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 16px;
      font-size: 0.7rem;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.4s ease;
      text-decoration: none;
      text-align: center;
    }

    .btn:hover {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
    }

    .btn-primary { background: #ffffff; color: #000000; }
    .btn-primary:hover { background: transparent; color: #ffffff; border-color: #ffffff; }

    .cursor::after {
      content: '█';
      animation: blink 1s step-start infinite;
      margin-left: 4px;
    }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
</head>
<body>

<div class="container">
  
  <div class="header">
    <!-- Pridané logo M.I.A. priamo do dizajnu -->
    <img src="tvoje-logo-ai-stred.png?v=3" alt="M.I.A. Logo" class="mia-logo" onerror="this.style.display='none'">
    
    <h1>LUCY AI</h1>
    <div class="subtitle">Digital Twin // Node Active</div>
  </div>

  <div class="node-box">
    <div class="status">
      <span class="dot"></span> Sovereign Interface
    </div>
    
    <div class="message cursor" id="lucy-output">
      Som Lucy, digitálna dvojička Lucie Malíčkovej. Rada vám zodpoviem na všetky otázky o nej. Zvoľte si okruh záujmu.
    </div>

    <div class="questions">
      <button class="question-btn" onclick="typeReply('Vzdelanie: Doktorát z neuromarketingu, DBA z High-Performance Computing a umelej inteligencie, inžiniersky titul z ekonómie a bakalársky zo zdravotníckych vied. Lucia pôsobí aj ako univerzitná lektorka pre digitálne zručnosti a behaviorálne stratégie.')">Vzdelanie & Skúsenosti <span>+</span></button>
      <button class="question-btn" onclick="typeReply('Schopnosti: Špecializuje sa na fine-tuning open-weights modelov (Mistral, Llama 3.1) na HPC infraštruktúre (Leonardo, LUMI), kvantové simulácie (Qiskit) a vývoj fyzikálnych neurónových sietí. Stavia off-grid AI komplex The Safe Haven na Tenerife.')">Schopnosti & Projekty <span>+</span></button>
      <button class="question-btn" onclick="typeReply('Publikácie: Jej najnovší výskum zahŕňa publikáciu \\'Behavioral Reprogramming of Open-Weights Models\\' pre žurnál Engineering Applications of Artificial Intelligence pod hlavičkou VŠB-TUO.')">Vedecké publikácie <span>+</span></button>
      <button class="question-btn" onclick="typeReply('Newsletter: Vo svojich textoch analyzuje hlboké prieniky AI a spoločnosti. Tretie vydanie sa venuje \\'output expansion\\' a štvrté flexibilite a schopnosti učiť sa. Všetky detaily nájdete na LinkedIn profile.')">Newsletter & Myšlienky <span>+</span></button>
    </div>
  </div>

  <div class="actions">
    <button class="btn btn-primary" onclick="downloadVCard()">Uložiť vizitku do telefónu</button>
    <a href="https://www.linkedin.com/in/lucia-malickova" target="_blank" class="btn">Spojiť sa na LinkedIn</a>
  </div>

</div>

<script>
  function downloadVCard() {
    const vcardData = 
`BEGIN:VCARD
VERSION:3.0
N:Malíčková;Lucia;Dr.;;
FN:Dr. Lucia Malíčková
ORG:Modelos Inteligencia Artificial S.L.
TITLE:Founder & AI Architect
TEL;TYPE=CELL:+421907536490
EMAIL;TYPE=WORK,INTERNET:lucy@thesafehaven.ai
URL:https://www.modelosinteligenciaartificial.es
URL;TYPE=LinkedIn:https://www.linkedin.com/in/lucia-malickova
NOTE:Získané cez fyzický AI Token. Digitálna dvojička Lucy AI.
END:VCARD`;

    const blob = new Blob([vcardData], { type: 'text/vcard;charset=utf-8' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = "Dr_Lucia_Malickova.vcf";
    link.click();
  }

  let typingTimeout;
  function typeReply(text) {
    const out = document.getElementById('lucy-output');
    clearTimeout(typingTimeout);
    out.innerHTML = '';
    let i = 0;
    
    function typeWriter() {
      if (i < text.length) {
        out.innerHTML += text.charAt(i);
        i++;
        typingTimeout = setTimeout(typeWriter, 15);
      }
    }
    typeWriter();
  }
</script>

</body>
</html>
