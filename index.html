<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Safe Haven | Sovereign Node</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-black: #000000;
      --surface: #070707;
      --text-main: #ffffff;
      --text-muted: #666666;
      --border: #222222;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-black);
      color: var(--text-main);
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 48px;
    }

    /* Architektonická hlavička */
    .header { text-align: center; }

    h1 {
      font-weight: 300;
      font-size: 1.6rem;
      letter-spacing: 0.35em; /* Extrémne široké luxusné medzery */
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .subtitle {
      font-weight: 300;
      font-size: 0.6rem;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    /* AI Interface (Ostrý blok) */
    .node-box {
      border: 1px solid var(--border);
      background: var(--surface);
      padding: 40px 24px;
      text-align: center;
    }

    .status {
      font-size: 0.55rem;
      letter-spacing: 0.25em;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .dot {
      width: 4px;
      height: 4px;
      background-color: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(255,255,255,0.8);
    }

    .message {
      font-weight: 300;
      font-size: 0.9rem;
      line-height: 1.8;
      color: #a3a3a3;
      margin-bottom: 32px;
    }

    .message b {
      font-weight: 600;
      color: #ffffff;
    }

    /* Ostré luxusné tlačidlá */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      width: 100%;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 18px;
      font-size: 0.7rem;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.4s ease;
      text-decoration: none;
      text-align: center;
    }

    .btn:hover {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
    }

    .btn-primary {
      background: #ffffff;
      color: #000000;
    }

    .btn-primary:hover {
      background: transparent;
      color: #ffffff;
      border-color: #ffffff;
    }

    .questions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .question-btn {
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border);
      color: var(--text-muted);
      padding: 12px 0;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      text-align: left;
      transition: color 0.3s ease;
    }

    .question-btn:hover { color: #ffffff; }
  </style>
</head>
<body>

<div class="container">
  
  <div class="header">
    <h1>The Safe Haven</h1>
    <div class="subtitle">Modelos Inteligencia Artificial</div>
  </div>

  <div class="node-box">
    <div class="status">
      <span class="dot"></span> Sovereign AI Node // Lucy
    </div>
    
    <div class="message" id="lucy-output">
      Prístup povolený. Som lokálna inteligencia spravujúca uzly. <b>Sme offline, sme suverénni.</b>
    </div>

    <div class="questions">
      <button class="question-btn" onclick="reply('arch')">Architektúra & Biomateriály →</button>
      <button class="question-btn" onclick="reply('ai')">HPC & Kvantové Modely →</button>
    </div>
  </div>

  <div class="actions">
    <button class="btn btn-primary" onclick="downloadVCard()">Uložiť prístupový kód (vCard)</button>
    <a href="https://www.linkedin.com/in/TVOJ-LINKEDIN" target="_blank" class="btn">Spojiť sa na LinkedIn</a>
  </div>

</div>

<script>
  function downloadVCard() {
    const vcardData = 
`BEGIN:VCARD
VERSION:3.0
N:Malíčková;Lucia;Dr.;;
FN:Dr. Lucia Malíčková
ORG:Modelos Inteligencia Artificial S.L.
TITLE:Founder & AI Architect
EMAIL;TYPE=INTERNET:kontakt@ailucy.es
URL:https://thesafehaven.ai
URL;TYPE=LinkedIn:https://www.linkedin.com/in/TVOJ-LINKEDIN
NOTE:The Safe Haven - Suverénna lokálna AI & Off-grid bio-architektúra
END:VCARD`;

    const blob = new Blob([vcardData], { type: 'text/vcard;charset=utf-8' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = "Dr_Lucia_Malickova.vcf";
    link.click();
  }

  function reply(type) {
    const out = document.getElementById('lucy-output');
    if (type === 'arch') {
      out.innerHTML = "Tvarujeme priestory z opunciovo-vápenných omietok podľa výpočtov neurónových sietí. Pasívna regulácia klímy a 3D tlačený nábytok. <b>Absolútny off-grid luxus.</b>";
    } else if (type === 'ai') {
      out.innerHTML = "Naše dáta neopúšťajú skalu. Optimalizujeme open-weights modely cez EuroHPC infraštruktúru a kvantové simulácie. <b>Žiadny cloud, plná kontrola.</b>";
    }
  }
</script>

</body>
</html>
