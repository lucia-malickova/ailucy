<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Safe Haven // Sovereign Node</title>
  <!-- Nádherné elegantné fonty z Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Farebná paleta inšpirovaná The Safe Haven */
      --bg-plaster: #F7F5F0;     /* Svetlá piesková / vápenná omietka */
      --text-dark: #2C2A28;      /* Teplá antracitová pre text */
      --text-muted: #8A857F;     /* Jemná šedá */
      --emerald-dark: #1A362D;   /* Hlboká luxusná smaragdová zelená */
      --border-light: #E8E4DB;   /* Jemné línie */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body { 
      background-color: var(--bg-plaster); 
      color: var(--text-dark); 
      font-family: 'Lato', sans-serif; 
      min-height: 100vh; 
      display: flex; 
      justify-content: center; 
      align-items: center;
      padding: 24px;
      /* Jemný prechod evokujúci dopadajúce svetlo na omietku */
      background-image: radial-gradient(circle at 50% 0%, #FFFFFF 0%, transparent 80%);
    }

    .container { 
      width: 100%; 
      max-width: 400px; 
      display: flex; 
      flex-direction: column; 
      gap: 36px; 
    }

    /* Hlavička */
    .header { text-align: center; }

    h1 { 
      font-family: 'Playfair Display', serif; 
      font-size: 2.4rem; 
      font-weight: 400; 
      color: var(--emerald-dark);
      margin-bottom: 6px;
      letter-spacing: 0.02em;
    }

    .subtitle { 
      font-size: 0.7rem; 
      font-weight: 700;
      color: var(--text-muted); 
      letter-spacing: 0.25em; 
      text-transform: uppercase; 
    }

    /* Digitálny Concierge (Lucy) */
    .concierge-card {
      background: rgba(255, 255, 255, 0.5);
      border: 1px solid var(--border-light);
      border-radius: 20px; /* Organické zaoblenie */
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.02);
    }

    .lucy-label {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.2rem;
      color: var(--emerald-dark);
      margin-bottom: 16px;
    }

    .ai-message {
      font-size: 1rem;
      line-height: 1.6;
      color: var(--text-dark);
      font-weight: 300;
      margin-bottom: 24px;
    }

    .ai-message b { font-weight: 700; }

    /* Organické minimalistické tlačidlá */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      width: 100%;
      display: inline-block;
      padding: 16px 24px;
      border-radius: 30px; /* Tvar kapsuly */
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: center;
    }

    .btn-primary {
      background: var(--emerald-dark);
      color: #FFFFFF;
      border: 1px solid var(--emerald-dark);
    }

    .btn-primary:hover {
      background: #11261F;
      transform: translateY(-2px);
    }

    .btn-outline {
      background: transparent;
      color: var(--text-dark);
      border: 1px solid var(--border-light);
    }

    .btn-outline:hover {
      border-color: var(--text-dark);
      background: rgba(0,0,0,0.02);
    }

    .divider {
      height: 1px;
      background: var(--border-light);
      margin: 16px auto;
      width: 40px;
    }

    /* AI interakčné čipy */
    .chat-options {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chip {
      background: #FFFFFF;
      border: 1px solid var(--border-light);
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: 'Lato', sans-serif;
    }

    .chip:hover {
      border-color: var(--emerald-dark);
      color: var(--emerald-dark);
    }
  </style>
</head>
<body>

<div class="container">
  
  <div class="header">
    <h1>The Safe Haven</h1>
    <div class="subtitle">Modelos Inteligencia Artificial</div>
  </div>

  <div class="concierge-card">
    <div class="lucy-label">Digitálny Concierge, Lucy</div>
    
    <div class="ai-message" id="lucy-output">
      Vitajte. Som lokálna inteligencia pre The Safe Haven. Prikladáte fyzický suverénny kľúč. Môžete si priamo uložiť kontakt na zakladateľku, alebo sa ma spýtať na detaily nášho priestoru.
    </div>

    <div class="chat-options">
      <button class="chip" onclick="reply('arch')">O architektúre a biomateriáloch</button>
      <button class="chip" onclick="reply('ai')">O suverénnej AI inteligencii</button>
    </div>
  </div>

  <div class="btn-group">
    <button class="btn btn-primary" onclick="downloadVCard()">Uložiť kontakt do telefónu</button>
    <a href="https://www.linkedin.com/in/TVOJ-LINKEDIN" target="_blank" class="btn btn-outline">Spojiť sa na LinkedIn</a>
  </div>

</div>

<script>
  function downloadVCard() {
    const vcardData = 
`BEGIN:VCARD
VERSION:3.0
N:Malíčková;Lucia;Dr.;;
FN:Dr. Lucia Malíčková
ORG:Modelos Inteligencia Artificial S.L.
TITLE:Founder & AI Architect
EMAIL;TYPE=INTERNET:kontakt@ailucy.es
URL:https://thesafehaven.ai
URL;TYPE=LinkedIn:https://www.linkedin.com/in/TVOJ-LINKEDIN
NOTE:The Safe Haven - Suverénna lokálna AI & Off-grid bio-architektúra na Tenerife
END:VCARD`;

    const blob = new Blob([vcardData], { type: 'text/vcard;charset=utf-8' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = "Dr_Lucia_Malickova.vcf";
    link.click();
  }

  function reply(type) {
    const out = document.getElementById('lucy-output');
    if (type === 'arch') {
      out.innerHTML = "Naše priestory dýchajú. Namiesto klimatizácie používame <b>opunciovo-vápenné omietky</b> formované neurónovými sieťami a parametrický 3D tlačený nábytok. Sme plne off-grid.";
    } else if (type === 'ai') {
      out.innerHTML = "Sme nezávislí. Naše dáta a modely bežia lokálne (on-premise) na špičkovej HPC infraštruktúre bez prístupu verejných cloudov. Úplná digitálna suverenita.";
    }
  }
</script>

</body>
</html>
